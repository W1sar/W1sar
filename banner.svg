<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ángel Riquelme, software a medida que se usa</title>
  <desc id="d">Banner del perfil: nombre, especialidad y una terminal con los proyectos terminados.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4f4f0" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#09090b"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" fill="#baff29"/>

  <text x="70" y="78" font-family="'Courier New',Courier,monospace" font-size="20" fill="#baff29" letter-spacing="6">POSADAS, MISIONES · 2026</text>
  <text x="68" y="168" font-family="Impact,'Arial Narrow Bold','Arial Black',sans-serif" font-size="86" fill="#f4f4f0" letter-spacing="1">ANGEL RIQUELME</text>
  <rect x="70" y="190" width="200" height="6" fill="#baff29"/>
  <text x="70" y="240" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="26" fill="#f4f4f0" fill-opacity=".75">Software a medida que se usa</text>
  <text x="70" y="276" font-family="'Courier New',Courier,monospace" font-size="18" fill="#f4f4f0" fill-opacity=".5">Webs · sistemas de gestión · bots de IA</text>

  <!-- terminal -->
  <g transform="translate(790 62)">
    <rect width="340" height="196" fill="#0d0d0f" stroke="#f4f4f0" stroke-opacity=".18"/>
    <rect width="340" height="34" fill="#f4f4f0" fill-opacity=".06"/>
    <rect x="16" y="13" width="8" height="8" fill="#baff29"/><rect x="32" y="13" width="8" height="8" fill="#f4f4f0" fill-opacity=".35"/><rect x="48" y="13" width="8" height="8" fill="#f4f4f0" fill-opacity=".35"/>
    <g font-family="'Courier New',Courier,monospace" font-size="17">
      <text x="20" y="68" fill="#baff29">$ proyectos --listar</text>
      <text x="20" y="98" fill="#f4f4f0">[x] caja-y-stock <tspan fill-opacity=".5">(PHP)</tspan></text>
      <text x="20" y="124" fill="#f4f4f0">[x] turnos-web <tspan fill-opacity=".5">(SQL)</tspan></text>
      <text x="20" y="150" fill="#f4f4f0">[x] hiro-digital <tspan fill-opacity=".5">(web)</tspan></text>
      <text x="20" y="178" fill="#baff29">&gt; siguiente proyecto</text>
      <rect x="208" y="164" width="10" height="18" fill="#baff29">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
